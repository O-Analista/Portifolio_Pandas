<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12271f"/>
      <stop offset="55%" stop-color="#1a3329"/>
      <stop offset="100%" stop-color="#0f221b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2f5a45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f5a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#2a4c3c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a4c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fd9b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7fd9b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fd9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- grade sutil de pontos -->
  <g fill="#8fd6b4" opacity="0.10">
    <g>
      <circle cx="120" cy="120" r="2.5"/><circle cx="200" cy="120" r="2.5"/><circle cx="280" cy="120" r="2.5"/>
      <circle cx="120" cy="200" r="2.5"/><circle cx="200" cy="200" r="2.5"/><circle cx="280" cy="200" r="2.5"/>
      <circle cx="120" cy="280" r="2.5"/><circle cx="200" cy="280" r="2.5"/><circle cx="280" cy="280" r="2.5"/>
    </g>
    <g transform="translate(1180,600)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="80" cy="0" r="2.5"/><circle cx="160" cy="0" r="2.5"/>
      <circle cx="0" cy="80" r="2.5"/><circle cx="80" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/>
      <circle cx="0" cy="160" r="2.5"/><circle cx="80" cy="160" r="2.5"/><circle cx="160" cy="160" r="2.5"/>
    </g>
  </g>

  <!-- icone: engrenagem (automação) -->
  <g transform="translate(1280,190)" opacity="0.9">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#8fd6b4" stroke-width="3" opacity="0.55"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#8fd6b4" stroke-width="3" opacity="0.85"/>
    <g stroke="#8fd6b4" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-70" x2="0" y2="-90"/>
      <line x1="0" y1="70" x2="0" y2="90"/>
      <line x1="-70" y1="0" x2="-90" y2="0"/>
      <line x1="70" y1="0" x2="90" y2="0"/>
      <line x1="-49" y1="-49" x2="-63" y2="-63"/>
      <line x1="49" y1="49" x2="63" y2="63"/>
      <line x1="-49" y1="49" x2="-63" y2="63"/>
      <line x1="49" y1="-49" x2="63" y2="-63"/>
    </g>
  </g>

  <!-- icone: planilha/relatorio -->
  <g transform="translate(1420,340)" opacity="0.85">
    <rect x="-55" y="-70" width="110" height="140" rx="8" fill="none" stroke="#8fd6b4" stroke-width="3"/>
    <line x1="-55" y1="-35" x2="55" y2="-35" stroke="#8fd6b4" stroke-width="2.5"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#8fd6b4" stroke-width="2.5"/>
    <line x1="-55" y1="35" x2="55" y2="35" stroke="#8fd6b4" stroke-width="2.5"/>
    <line x1="-18" y1="-70" x2="-18" y2="70" stroke="#8fd6b4" stroke-width="2.5"/>
    <line x1="18" y1="-70" x2="18" y2="70" stroke="#8fd6b4" stroke-width="2.5"/>
  </g>

  <!-- linha decorativa -->
  <rect x="110" y="430" width="420" height="4" fill="url(#lineGrad)"/>

  <!-- textos -->
  <text x="110" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="6" fill="#7fd9b0" font-weight="600">PROJETO DE AUTOMAÇÃO</text>

  <text x="108" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="86" fill="#f2fbf6" font-weight="700">Automação de</text>
  <text x="108" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="86" fill="#f2fbf6" font-weight="700">Relatórios</text>

  <text x="110" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#bfe8d3" font-weight="400">com Python, Pandas e Win32</text>

  <!-- badges das tecnologias -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="110" y="720" width="150" height="56" rx="28" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="185" y="756" fill="#eafff2" text-anchor="middle">Python</text>

    <rect x="280" y="720" width="150" height="56" rx="28" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="355" y="756" fill="#eafff2" text-anchor="middle">Pandas</text>

    <rect x="450" y="720" width="150" height="56" rx="28" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="525" y="756" fill="#eafff2" text-anchor="middle">Win32</text>
  </g>
</svg>
