<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12271f"/>
      <stop offset="55%" stop-color="#1a3329"/>
      <stop offset="100%" stop-color="#0f221b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2f5a45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f5a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#2a4c3c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a4c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fd9b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7fd9b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fd9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- grade sutil de pontos -->
  <g fill="#8fd6b4" opacity="0.10">
    <g>
      <circle cx="120" cy="120" r="2.5"/><circle cx="200" cy="120" r="2.5"/><circle cx="280" cy="120" r="2.5"/>
      <circle cx="120" cy="200" r="2.5"/><circle cx="200" cy="200" r="2.5"/><circle cx="280" cy="200" r="2.5"/>
      <circle cx="120" cy="280" r="2.5"/><circle cx="200" cy="280" r="2.5"/><circle cx="280" cy="280" r="2.5"/>
    </g>
    <g transform="translate(1180,600)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="80" cy="0" r="2.5"/><circle cx="160" cy="0" r="2.5"/>
      <circle cx="0" cy="80" r="2.5"/><circle cx="80" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/>
      <circle cx="0" cy="160" r="2.5"/><circle cx="80" cy="160" r="2.5"/><circle cx="160" cy="160" r="2.5"/>
    </g>
  </g>

  <!-- icone: fluxo ETL (extract -> transform -> load) -->
  <g transform="translate(1150,300)" opacity="0.92" font-family="Segoe UI, Arial, sans-serif">
    <!-- caixa 1: extract -->
    <rect x="-190" y="-30" width="90" height="60" rx="8" fill="none" stroke="#8fd6b4" stroke-width="3"/>
    <text x="-145" y="8" text-anchor="middle" font-size="16" fill="#eafff2" font-weight="600">E</text>
    <!-- seta -->
    <line x1="-95" y1="0" x2="-55" y2="0" stroke="#7fd9b0" stroke-width="3"/>
    <polygon points="-55,0 -66,-7 -66,7" fill="#7fd9b0"/>
    <!-- caixa 2: transform -->
    <rect x="-45" y="-30" width="90" height="60" rx="8" fill="#8fd6b4" fill-opacity="0.18" stroke="#8fd6b4" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-size="16" fill="#eafff2" font-weight="600">T</text>
    <!-- seta -->
    <line x1="50" y1="0" x2="90" y2="0" stroke="#7fd9b0" stroke-width="3"/>
    <polygon points="90,0 79,-7 79,7" fill="#7fd9b0"/>
    <!-- caixa 3: load -->
    <rect x="100" y="-30" width="90" height="60" rx="8" fill="none" stroke="#8fd6b4" stroke-width="3"/>
    <text x="145" y="8" text-anchor="middle" font-size="16" fill="#eafff2" font-weight="600">L</text>
  </g>

  <!-- icone: banco de dados -->
  <g transform="translate(1420,470)" opacity="0.85">
    <ellipse cx="0" cy="-40" rx="42" ry="14" fill="none" stroke="#8fd6b4" stroke-width="3"/>
    <path d="M -42 -40 L -42 40 A 42 14 0 0 0 42 40 L 42 -40" fill="none" stroke="#8fd6b4" stroke-width="3"/>
    <path d="M -42 -6 A 42 14 0 0 0 42 -6" fill="none" stroke="#8fd6b4" stroke-width="2.5" opacity="0.7"/>
    <path d="M -42 17 A 42 14 0 0 0 42 17" fill="none" stroke="#8fd6b4" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- linha decorativa -->
  <rect x="110" y="430" width="420" height="4" fill="url(#lineGrad)"/>

  <!-- textos -->
  <text x="110" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="6" fill="#7fd9b0" font-weight="600">PROJETO DE DADOS</text>

  <text x="108" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="86" fill="#f2fbf6" font-weight="700">Pipeline ETL</text>
  <text x="108" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="86" fill="#f2fbf6" font-weight="700">com Pandas</text>

  <text x="110" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#bfe8d3" font-weight="400">Extração, transformação e carga de dados</text>

  <!-- badges das tecnologias -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">
    <rect x="110" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="185" y="744" fill="#eafff2" text-anchor="middle">Python</text>

    <rect x="278" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="353" y="744" fill="#eafff2" text-anchor="middle">Pandas</text>

    <rect x="446" y="710" width="110" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="501" y="744" fill="#eafff2" text-anchor="middle">ETL</text>
  </g>
</svg>
