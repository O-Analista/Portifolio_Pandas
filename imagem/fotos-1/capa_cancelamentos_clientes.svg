<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12271f"/>
      <stop offset="55%" stop-color="#1a3329"/>
      <stop offset="100%" stop-color="#0f221b"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2f5a45" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2f5a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#2a4c3c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a4c3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fd9b0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7fd9b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7fd9b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>

  <!-- grade sutil de pontos -->
  <g fill="#8fd6b4" opacity="0.10">
    <g>
      <circle cx="120" cy="120" r="2.5"/><circle cx="200" cy="120" r="2.5"/><circle cx="280" cy="120" r="2.5"/>
      <circle cx="120" cy="200" r="2.5"/><circle cx="200" cy="200" r="2.5"/><circle cx="280" cy="200" r="2.5"/>
      <circle cx="120" cy="280" r="2.5"/><circle cx="200" cy="280" r="2.5"/><circle cx="280" cy="280" r="2.5"/>
    </g>
    <g transform="translate(1180,600)">
      <circle cx="0" cy="0" r="2.5"/><circle cx="80" cy="0" r="2.5"/><circle cx="160" cy="0" r="2.5"/>
      <circle cx="0" cy="80" r="2.5"/><circle cx="80" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/>
      <circle cx="0" cy="160" r="2.5"/><circle cx="80" cy="160" r="2.5"/><circle cx="160" cy="160" r="2.5"/>
    </g>
  </g>

  <!-- icone: clientes (grupo de pessoas) -->
  <g transform="translate(1230,270)" opacity="0.9" stroke="#8fd6b4" stroke-width="3" fill="none">
    <circle cx="-40" cy="-25" r="20"/>
    <path d="M -72 40 Q -72 5 -40 5 Q -8 5 -8 40 Z"/>
    <circle cx="35" cy="-15" r="26" opacity="0.6"/>
    <path d="M -3 45 Q -3 3 35 3 Q 73 3 73 45 Z" opacity="0.6"/>
  </g>

  <!-- icone: cancelamento (X circulado) -->
  <g transform="translate(1420,430)" opacity="0.95">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#e08a7d" stroke-width="4" opacity="0.85"/>
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#e08a7d" stroke-width="6" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="-18" y2="18" stroke="#e08a7d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- seta indicando saida -->
  <g transform="translate(1330,350)" opacity="0.7">
    <line x1="0" y1="0" x2="55" y2="45" stroke="#8fd6b4" stroke-width="2.5" stroke-dasharray="6 6"/>
    <polygon points="55,45 40,38 47,58" fill="#8fd6b4"/>
  </g>

  <!-- linha decorativa -->
  <rect x="110" y="430" width="420" height="4" fill="url(#lineGrad)"/>

  <!-- textos -->
  <text x="110" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="6" fill="#7fd9b0" font-weight="600">PROJETO DE ANÁLISE</text>

  <text x="108" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="80" fill="#f2fbf6" font-weight="700">Análise de</text>
  <text x="108" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="80" fill="#f2fbf6" font-weight="700">Cancelamentos x Clientes</text>

  <text x="110" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#bfe8d3" font-weight="400">Churn Analysis com Python, Pandas, NumPy e Plotly</text>

  <!-- badges das tecnologias -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">
    <rect x="110" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="185" y="744" fill="#eafff2" text-anchor="middle">Python</text>

    <rect x="278" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="353" y="744" fill="#eafff2" text-anchor="middle">Pandas</text>

    <rect x="446" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="521" y="744" fill="#eafff2" text-anchor="middle">NumPy</text>

    <rect x="614" y="710" width="150" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="689" y="744" fill="#eafff2" text-anchor="middle">Plotly</text>

    <rect x="782" y="710" width="180" height="54" rx="27" fill="#20402f" stroke="#4f9578" stroke-width="1.5"/>
    <text x="872" y="744" fill="#eafff2" text-anchor="middle">Google Colab</text>
  </g>
</svg>
